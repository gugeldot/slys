name: Bug report
description: Something does not work as expected
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real seed or password here.** For security vulnerabilities use the private
        reporting option in the Security tab instead of a public issue.
  - type: input
    id: version
    attributes:
      label: SLYS version
      description: Shown in the About screen, or by `slys version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux (Flatpak), Linux (zip), Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
