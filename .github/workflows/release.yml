name: Release

# Push a tag like v1.6.0 to build everything and create a DRAFT release.
# Review the draft (checksums, attestations, install tests) and publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the version in the repository
        run: scripts/check-version.sh "${GITHUB_REF_NAME}"
        if: startsWith(github.ref, 'refs/tags/')

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
      - name: Bundle the Visual C++ runtime next to the app (app-local deployment)
        shell: pwsh
        run: |
          $rel = "app\build\windows\x64\runner\Release"
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$d" $rel
          }
      # Code signing: see documentation/SIGNING.md. Sign the .exe files before building the installer and
      # the installer itself once a certificate (e.g. SignPath Foundation) is available.
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          # Inno Setup is preinstalled on the runner image but is not always on PATH.
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" packaging\windows\slys.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath dist\Slys_Windows_Portable.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/Slys_Installer.exe
            dist/Slys_Windows_Portable.zip

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - name: Archives
        run: |
          mkdir -p dist
          bundle=app/build/linux/x64/release/bundle
          (cd "$bundle" && zip -qr "$GITHUB_WORKSPACE/dist/Slys_Linux.zip" .)
          tar -czf dist/slys-linux-x64.tar.gz -C "$bundle" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/Slys_Linux.zip
            dist/slys-linux-x64.tar.gz

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: Slys.flatpak
          manifest-path: packaging/flatpak/io.github.gugeldot.Slys.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: Slys.flatpak

  publish:
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staging
      - name: SBOM of the Rust dependencies (CycloneDX)
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-cyclonedx
      - name: Collect assets and checksums
        run: |
          cargo cyclonedx --format json
          mkdir dist
          i=0; for f in $(find crates -name '*.cdx.json'); do cp "$f" "dist/Slys_SBOM_$(basename "$f")"; done
          cp staging/windows/Slys_Installer.exe staging/windows/Slys_Windows_Portable.zip dist/
          cp staging/linux/Slys_Linux.zip staging/flatpak/Slys.flatpak dist/
          scripts/make-checksums.sh dist
      - name: Provenance attestation (who built these files, from which commit)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # The notes are the CHANGELOG.md section of this version, plus how to verify the files.
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ && p {exit} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "---"
            echo "Verify your download with \`SHA256SUMS\` or \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "SLYS ${ver}" --notes-file notes.md
