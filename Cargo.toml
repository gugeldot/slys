[workspace]
resolver = "2"
exclude = ["fuzz"]
members = ["crates/slys-core", "crates/slys-cli", "crates/slys-bridge"]

[workspace.package]
# Single source of truth for the version. `scripts/set-version.sh` propagates it
# to app/pubspec.yaml, the Inno Setup script and the Flatpak metainfo.
version = "1.7.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gugeldot/slys"
authors = ["Gugeldot"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Dependencies (Argon2, AES, SHA-2...) are compiled with optimisations even in debug builds:
# otherwise key derivation is ~30x slower and tests / `make dev` crawl.
[profile.dev.package."*"]
opt-level = 2
