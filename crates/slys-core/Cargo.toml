[package]
name = "slys-core"
description = "SLYS core: fragment a file into encrypted pieces and rebuild it from a seed and a password."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["stream"] }
argon2 = "0.6"
hkdf = "0.13"
sha2 = "0.11"
rand = "0.10"
zeroize = "1"
crc32fast = "1"
base64 = "0.22"
unicode-normalization = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Read-only support for seeds and fragments made by SLYS 1.x (AES-256-CBC + PBKDF2).
aes = "0.9"
cbc = "0.2"
cipher = { version = "0.5", features = ["block-padding"] }
pbkdf2 = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
