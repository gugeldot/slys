[package]
name = "slys-cli"
description = "Command-line interface for SLYS: lets you test and script the core without the app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "slys"
path = "src/main.rs"

[dependencies]
slys-core = { path = "../slys-core" }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
zeroize = "1"
indicatif = "0.17"
